name: Docker CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: wsl-ubuntu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -f dockerfile -t node-docker-app:latest .

      - name: Test run container
        run: |
          docker run -d -p 3000:3000 --name test-container node-docker-app:latest
          sleep 3
          curl --fail http://localhost:3000 || exit 1
