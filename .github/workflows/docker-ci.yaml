name: docker ci pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: [self-hosted, wsl-ubuntu]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -f dockerfile.security -t ${{ vars.DOCKERHUB_USERNAME }}/nodeapp5:latest -t ${{ vars.DOCKERHUB_USERNAME }}/nodeapp5:${GITHUB_SHA::7} .

      - name: Push Docker image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/nodeapp5:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/nodeapp5:${GITHUB_SHA::7}
